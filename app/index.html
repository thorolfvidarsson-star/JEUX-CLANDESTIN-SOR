<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Espace jeux du club SOR. Page d’accueil.">
  <meta name="theme-color" content="#101014">
  <link rel="icon" href="data:,">
  <title>JEUX CLANDESTINS · SOR</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f3f1ef; background: #101014; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; padding: 28px 20px; display: grid; place-items: center; background: radial-gradient(ellipse at top, #301820 0, #101014 65%); }
    main { width: min(100%, 760px); }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
    .mark { display: grid; place-items: center; width: 48px; height: 48px; flex-shrink: 0; border: 1px solid #a54a55; border-radius: 12px; background: #701f2d; font-weight: 800; letter-spacing: -.04em; }
    .brand p { margin: 0; font-size: .8rem; font-weight: 650; letter-spacing: .12em; overflow-wrap: anywhere; }
    .eyebrow { margin: 0 0 14px; color: #e9a3aa; font-size: .75rem; font-weight: 700; letter-spacing: .15em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 9vw, 4.5rem); line-height: 1.07; font-weight: 850; letter-spacing: -.045em; overflow-wrap: anywhere; }
    h1 span { display: block; color: #ec8995; }
    .intro { max-width: 540px; margin: 22px 0 32px; color: #c4bec3; font-size: 1.05rem; line-height: 1.65; }
    .notice { padding: 24px; border: 1px solid #4a343c; border-radius: 16px; background: #1b191f; box-shadow: 0 16px 50px #0003; }
    .status { display: inline-block; margin-bottom: 14px; padding: 6px 10px; border: 1px solid #68414a; border-radius: 999px; color: #f3c6cb; background: #36232a; font-size: .75rem; }
    h2 { margin: 0 0 10px; font-size: 1.2rem; }
    .notice p { max-width: 570px; margin: 0; color: #c4bec3; line-height: 1.65; }
    footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 36px; padding-top: 20px; border-top: 1px solid #363039; color: #a79ca5; font-size: .75rem; line-height: 1.5; }
    @media (max-width: 400px) { body { padding: 24px 16px; } .brand { margin-bottom: 32px; } .notice { padding: 20px; } }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <div class="mark" aria-hidden="true">SOR</div>
      <p>JEUX-CLANDESTIN-SOR</p>
    </header>
    <p class="eyebrow">Espace du club</p>
    <h1>JEUX <span>CLANDESTINS</span></h1>
    <p class="intro">Bienvenue dans l’espace jeux du club.</p>
    <section class="notice" aria-labelledby="etat">
      <span class="status">En préparation</span>
      <h2 id="etat">Les jeux arrivent bientôt</h2>
      <p>Aucun jeu n’est disponible pour le moment. Cette page d’accueil sera complétée lorsque l’espace jeux sera prêt.</p>
    </section>
    <footer>
      <span>JEUX-CLANDESTIN-SOR</span>
      <span>Accueil · v0.0.1</span>
    </footer>
  </main>
</body>
</html>
